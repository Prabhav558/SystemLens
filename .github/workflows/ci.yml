name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,groq,api,faiss,mcp]"
      - run: pytest -q
      # the deterministic layer must keep linking the right containers
      - run: agent eval run examples/eval/error-project/suite.yaml --no-llm --min-pass-rate 1.0
      - run: python -m build
